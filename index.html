<style>
:root{
  box-sizing:border-box;
  --paper:#FAF9F6;
  --paper-2:#F1EFE9;
  --ink:#1B2233;
  --ink-soft:#5B6178;
  --line:#E4E1D8;
  --indigo:#33409E;
  --indigo-deep:#242C74;
  --indigo-tint:#EBEDFA;
  --amber:#DD9A2E;
  --amber-tint:#FBF0DC;
  --green:#2F9E63;
  --green-tint:#E4F6EC;
  --red:#D14B4B;
  --red-tint:#FCE9E9;
  --slate:#8B90A3;
  --card:#FFFFFF;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --shadow:0 1px 2px rgba(27,34,51,.04), 0 6px 20px rgba(27,34,51,.06);
  --font-head:'Lexend',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --paper:#12141C;
  --paper-2:#181B26;
  --ink:#EDEFF7;
  --ink-soft:#9BA0B4;
  --line:#2A2E3E;
  --indigo:#6C7BE8;
  --indigo-deep:#8993EF;
  --indigo-tint:#1D2247;
  --amber:#E8AE4D;
  --amber-tint:#332714;
  --green:#4FBE8A;
  --green-tint:#12291E;
  --red:#E1706F;
  --red-tint:#33191A;
  --slate:#767C93;
  --card:#1B1E2A;
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
}
button{color:inherit;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0;
  height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-head); margin:0; color:var(--ink); letter-spacing:-0.01em;}
p{margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit}
::selection{background:var(--indigo); color:#fff;}

.app{
  display:flex;
  min-height:100%;
}

/* ---------- Sidebar (desktop) ---------- */
.sidebar{
  width:236px;
  flex-shrink:0;
  background:var(--paper-2);
  border-right:1px solid var(--line);
  padding:24px 14px;
  display:none;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
  padding:6px 12px 22px 12px;
}
.brand-mark{
  font-family:var(--font-head);
  font-weight:800;
  font-size:20px;
  color:var(--indigo);
}
.brand-sub{font-size:11px; color:var(--ink-soft); font-weight:500;}
.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 14px;
  border-radius:12px;
  color:var(--ink-soft);
  font-weight:600;
  font-size:14.5px;
  cursor:pointer;
  border:none;
  background:none;
  text-align:left;
  width:100%;
}
.nav-item svg{width:19px; height:19px; flex-shrink:0;}
.nav-item:hover{background:var(--indigo-tint); color:var(--indigo);}
.nav-item.active{background:var(--indigo); color:#fff;}
.sidebar-foot{margin-top:auto; padding:12px; font-size:11.5px; color:var(--slate);}

/* ---------- Main ---------- */
.main{
  flex:1;
  min-width:0;
  padding:18px 16px 96px 16px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.topbar h1{font-size:22px; font-weight:700;}
.topbar .date-pill{
  font-size:12.5px; color:var(--ink-soft); font-weight:500;
  background:var(--paper-2); padding:6px 12px; border-radius:20px; border:1px solid var(--line);
}

.view{display:none;}
.view.active{display:block; animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.view.active{animation:none} *{transition:none !important}}

/* ---------- Cards & Grid ---------- */
.grid{display:grid; gap:12px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
  box-shadow:var(--shadow);
}
.card-flat{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
}
.section-title{
  font-size:15px; font-weight:700; margin:26px 0 10px 0; color:var(--ink);
  display:flex; align-items:center; justify-content:space-between;
}
.section-title:first-child{margin-top:0;}
.muted{color:var(--ink-soft); font-size:12.5px;}

/* ---------- Hero countdown ---------- */
.hero{
  background:linear-gradient(135deg, var(--indigo-deep), var(--indigo));
  border-radius:var(--radius-lg);
  padding:22px;
  color:#fff;
  position:relative;
  overflow:hidden;
}
.hero-row{display:flex; gap:14px; flex-wrap:wrap;}
.hero-exam{flex:1; min-width:130px;}
.hero-exam .label{font-size:12px; opacity:.75; font-weight:600; text-transform:none;}
.hero-exam .num{font-family:var(--font-head); font-size:40px; font-weight:800; line-height:1.05; margin-top:2px;}
.hero-exam .num span{font-size:16px; font-weight:600; opacity:.8;}
.hero-exam .sub{font-size:11.5px; opacity:.7; margin-top:2px;}
.hero-divider{width:1px; background:rgba(255,255,255,.2); align-self:stretch;}

/* ---------- Stat tiles ---------- */
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:14px; display:flex; flex-direction:column; gap:6px;
}
.stat .icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:2px;}
.stat .icon svg{width:16px; height:16px;}
.stat .val{font-family:var(--font-head); font-size:22px; font-weight:700;}
.stat .lbl{font-size:12px; color:var(--ink-soft); font-weight:500;}

/* progress bars */
.pbar{height:8px; border-radius:6px; background:var(--paper-2); overflow:hidden; margin-top:8px;}
.pbar > div{height:100%; border-radius:6px; background:var(--indigo); transition:width .4s ease;}
.pbar.amber > div{background:var(--amber);}
.pbar.green > div{background:var(--green);}
.pbar-row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:2px;}

/* quick actions */
.qa-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.qa-btn{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px;
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
  cursor:pointer; min-width:84px; font-size:11.5px; font-weight:600; color:var(--ink);
}
.qa-btn .qico{width:34px; height:34px; border-radius:10px; background:var(--indigo-tint); color:var(--indigo); display:flex; align-items:center; justify-content:center;}
.qa-btn .qico svg{width:17px; height:17px;}
.qa-btn:active{transform:scale(.96);}

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 18px; border-radius:12px; border:none; font-weight:600; font-size:14px;
  cursor:pointer; background:var(--indigo); color:#fff;
}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--paper-2); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:var(--red);}
.btn.ghost{background:transparent; color:var(--indigo); padding:8px 10px;}
.btn.block{width:100%;}
.btn.sm{padding:7px 12px; font-size:12.5px; border-radius:9px;}
.fab{
  position:fixed; right:18px; bottom:86px; z-index:40;
  width:56px; height:56px; border-radius:50%; background:var(--indigo); color:#fff;
  display:flex; align-items:center; justify-content:center; border:none; box-shadow:0 8px 20px rgba(51,64,158,.35);
  cursor:pointer;
}
.fab svg{width:24px; height:24px;}
@media (min-width:900px){.fab{bottom:28px;}}

/* forms */
.field{margin-bottom:13px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:14.5px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--indigo); outline-offset:1px;}
.field-row{display:flex; gap:10px;}
.field-row > .field{flex:1;}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.seg button{flex:1; padding:9px 6px; background:var(--paper); border:none; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--indigo); color:#fff;}

/* list rows */
.list{display:flex; flex-direction:column; gap:8px;}
.row-item{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
  display:flex; align-items:center; gap:12px;
}
.row-item .ri-main{flex:1; min-width:0;}
.row-item .ri-title{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:8px;}
.row-item .ri-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.row-item .ri-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{
  width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
}
.icon-btn svg{width:15px; height:15px;}
.icon-btn:hover{color:var(--indigo); border-color:var(--indigo);}

.badge{
  font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;
}
.badge.high{background:var(--red-tint); color:var(--red);}
.badge.medium{background:var(--amber-tint); color:var(--amber);}
.badge.low{background:var(--green-tint); color:var(--green);}
.badge.done{background:var(--green-tint); color:var(--green);}
.badge.pending{background:var(--paper-2); color:var(--ink-soft);}
.badge.studying{background:var(--indigo-tint); color:var(--indigo);}
.badge.notstarted{background:var(--paper-2); color:var(--slate);}
.badge.revised{background:var(--amber-tint); color:var(--amber);}
.badge.overdue{background:var(--red-tint); color:var(--red);}
.badge.weak{background:var(--red-tint); color:var(--red);}
.badge.duetoday{background:var(--amber-tint); color:var(--amber);}
.badge.upcoming{background:var(--indigo-tint); color:var(--indigo);}
.badge.weak{background:var(--red-tint); color:var(--red);}
.badge.average{background:var(--amber-tint); color:var(--amber);}
.badge.strong{background:var(--green-tint); color:var(--green);}

.checkline{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft);}
.checkline input{width:16px; height:16px;}

/* tabs (subject/section tabs) */
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; -webkit-overflow-scrolling:touch;}
.tab{
  flex:0 0 auto; padding:8px 15px; border-radius:20px; background:var(--paper-2); border:1px solid var(--line);
  font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--indigo); color:#fff; border-color:var(--indigo);}

.searchbar{display:flex; gap:8px; margin-bottom:12px;}
.searchbar input{flex:1;}
.filter-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:12px;}
.filter-row select{flex:0 0 auto; min-width:120px;}

/* empty state */
.empty{
  text-align:center; padding:38px 20px; color:var(--ink-soft);
}
.empty .ee{font-size:34px; margin-bottom:10px;}
.empty h4{color:var(--ink); font-size:15px; margin-bottom:4px;}
.empty p{font-size:13px;}

/* modal */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,22,35,.45); z-index:100; display:none;
  align-items:flex-end; justify-content:center;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--paper); width:100%; max-width:520px; border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)) 18px; max-height:88vh; overflow-y:auto;
  animation:slideup .25s ease;
}
@media (min-width:640px){
  .modal-backdrop{align-items:center;}
  .modal{border-radius:22px; max-height:82vh;}
}
@keyframes slideup{from{transform:translateY(30px); opacity:.6;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:17px;}
.modal-close{width:30px; height:30px; border-radius:50%; border:none; background:var(--paper-2); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.modal-actions .btn{flex:1;}

/* toast */
.toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:24px; font-size:13.5px;
  font-weight:500; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
:root[data-theme="dark"] .toast{background:#EDEFF7; color:#12141C;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
@media (min-width:900px){.toast{bottom:24px;}}

/* bottom nav mobile */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;
}
.bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  border:none; background:none; color:var(--ink-soft); font-size:10px; font-weight:600; cursor:pointer;
}
.bn-item svg{width:20px; height:20px;}
.bn-item.active{color:var(--indigo);}
@media (min-width:900px){

  .sidebar{display:flex;}
  .main{padding:28px 34px 40px 34px;}
}
@media (max-width:899px){
  .main{padding-bottom:88px;}
}

/* timer */
.timer-display{

.timer-mode-label{text-align:center; font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
.timer-controls{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
.timer-controls .btn{min-width:96px;}

/* bar chart (css based) */
.barchart{display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px;}
.barchart .bcol{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.barchart .bcol .bar{width:100%; max-width:26px; border-radius:6px 6px 3px 3px; background:var(--indigo); min-height:3px;}
.barchart .bcol .blabel{font-size:10px; color:var(--ink-soft);}
.barchart .bcol .bval{font-size:10px; color:var(--ink-soft); font-weight:600;}

.hbar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.hbar-row .hb-label{width:88px; flex-shrink:0; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.hbar-row .hb-track{flex:1; height:10px; background:var(--paper-2); border-radius:6px; overflow:hidden;}
.hbar-row .hb-track > div{height:100%; border-radius:6px;}
.hbar-row .hb-val{width:38px; text-align:right; font-size:12px; font-weight:700; flex-shrink:0;}

.two-col{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:760px){.two-col{grid-template-columns:1.3fr 1fr;}}

.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:6px 12px; border-radius:20px; background:var(--paper-2); border:1px solid var(--line); font-size:12px; font-weight:600; color:var(--ink-soft);}

table.simple{width:100%; border-collapse:collapse; font-size:13px;}
table.simple th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--slate); padding:6px 8px; border-bottom:1px solid var(--line);}
table.simple td{padding:9px 8px; border-bottom:1px solid var(--line);}
.table-wrap{overflow-x:auto;}

.streak-flame{display:flex; align-items:center; gap:8px;}
.streak-flame .num{font-family:var(--font-head); font-size:28px; font-weight:800; color:var(--amber);}


/* ---------- Auth screen ---------- */
.auth-screen{
  position:fixed; inset:0; z-index:150; background:var(--paper); overflow-y:auto;
  display:flex; align-items:flex-start; justify-content:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));
}

.auth-wrap{width:100%; max-width:400px; margin:auto 0;}
.auth-brand{display:flex; align-items:baseline; gap:8px; margin-bottom:26px;}
.auth-brand .brand-mark{font-size:26px;}
.auth-brand .brand-sub{font-size:13px;}
.auth-wrap h2{font-size:24px; font-weight:700; margin-bottom:6px;}
.auth-lead{color:var(--ink-soft); font-size:14px; line-height:1.5; margin-bottom:20px;}
.auth-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow);}

.auth-card .seg button{padding:10px 6px; font-size:13.5px;}
.auth-card .field input{padding:12px 13px; font-size:15px;}
.pw-row{position:relative;}
.pw-row input{padding-right:64px;}
.pw-toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--indigo); font-weight:600; font-size:12.5px;
  padding:8px; cursor:pointer; border-radius:8px;
}
.pw-toggle:focus-visible, .auth-link:focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}
.auth-msg{display:none; font-size:13px; line-height:1.45; padding:10px 12px; border-radius:10px; margin-bottom:14px;}
.auth-msg.show{display:block;}
.auth-msg.error{background:var(--red-tint); color:var(--red);}
.auth-msg.ok{background:var(--green-tint); color:var(--green);}
.auth-card .btn{padding:13px 18px; font-size:15px; margin-top:6px;}
.auth-card .btn[disabled]{opacity:.6; cursor:default;}
.auth-link{background:none; border:none; color:var(--indigo); font-weight:600; font-size:13px; cursor:pointer; padding:6px 0;}
.auth-foot{display:flex; justify-content:center; margin-top:10px;}
.auth-loading{display:flex; align-items:center; justify-content:center; gap:10px; color:var(--ink-soft); font-size:14px; margin:auto;}

<script>

function initFirebase(){

    firebase.initializeApp(FIREBASE_CONFIG);

/* Returns the saved document, null if this user has none yet, or undefined if the read failed. */
async function fbLoad(){
  if(!fbUid) return undefined;
  try{
    const snap = await fbDb.collection('users').doc(fbUid).get();
    return snap.exists ? snap.data() : null;
  }catch(e){ console.error('Firestore load failed', e); return undefined; }
}
function fbSave(){
  if(!fbReady || !DATA) return;
  fbDb.collection('users').doc(fbUid).set(DATA).catch(e=>console.error('Firestore save failed', e));
}

/* ---------------- Auth (email + password) ---------------- */
let authMode = 'login';   // 'login' | 'signup'
let pendingName = '';

const AUTH_ERRORS = {
  'auth/invalid-email': 'That email address doesn’t look right. Check it and try again.',
  'auth/missing-email': 'Enter your email address.',
  'auth/missing-password': 'Enter your password.',
  'auth/user-not-found': 'No account found with this email. Sign up to create one.',
  'auth/wrong-password': 'Wrong password. Try again or reset it.',
  'auth/invalid-credential': 'Email or password is incorrect.',
  'auth/invalid-login-credentials': 'Email or password is incorrect.',
  'auth/email-already-in-use': 'This email already has an account. Log in instead.',
  'auth/weak-password': 'Password is too short. Use at least 6 characters.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes, or reset your password.',
  'auth/network-request-failed': 'No internet connection. Check your network and try again.',
  'auth/user-disabled': 'This account has been disabled.',
  'auth/operation-not-allowed': 'Email sign-in is turned off. Enable Email/Password under Authentication → Sign-in method in the Firebase console.',
  'auth/unauthorized-domain': 'This site’s domain isn’t authorised. Add it under Authentication → Settings → Authorized domains in the Firebase console.',
  'auth/operation-not-supported-in-this-environment': 'Login needs the app to be opened from a website (http/https), not as a local file.'
};
function authMsg(text, type){
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (text ? ' show ' + (type||'error') : '');
}
function setAuthMode(mode){
  authMode = mode;
  const signup = mode==='signup';
  document.getElementById('tabLogin').classList.toggle('active', !signup);
  document.getElementById('tabSignup').classList.toggle('active', signup);
  document.getElementById('authTitle').textContent = signup ? 'Create your account' : 'Welcome back';
  document.getElementById('authLead').textContent = signup
    ? 'Your syllabus, tests and streaks stay saved to your account.'
    : 'Log in to see your progress on any device.';
  document.getElementById('nameField').hidden = !signup;
  document.getElementById('forgotRow').hidden = signup;
  document.getElementById('authSubmit').textContent = signup ? 'Create account' : 'Log in';
  document.getElementById('authPass').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
  authMsg('');
}
function showAuthScreen(){
  document.getElementById('authScreen').hidden = false;
  document.getElementById('authLoading').hidden = true;
  document.getElementById('authWrap').hidden = false;
}
function hideAuthScreen(){
  document.getElementById('authScreen').hidden = true;
}
function showAuthLoading(msg){
  document.getElementById('authScreen').hidden = false;
  document.getElementById('authWrap').hidden = true;
  const l = document.getElementById('authLoading');
  l.hidden = false;
  l.querySelector('span:last-child').textContent = msg || 'Loading…';
}
async function submitAuth(e){
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  if(!email){ authMsg(AUTH_ERRORS['auth/missing-email']); return; }
  if(!pass){ authMsg(AUTH_ERRORS['auth/missing-password']); return; }
  const btn = document.getElementById('authSubmit');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = authMode==='signup' ? 'Creating account…' : 'Logging in…';
  authMsg('');
  try{
    if(authMode==='signup'){
      pendingName = document.getElementById('authName').value.trim();
      await fbAuth.createUserWithEmailAndPassword(email, pass);
    } else {
      await fbAuth.signInWithEmailAndPassword(email, pass);
    }
    // onAuthStateChanged takes it from here
  }catch(err){
    console.error('Auth error', err);
    authMsg(AUTH_ERRORS[err.code] || 'Something went wrong. Please try again.');
    btn.disabled = false; btn.textContent = label;
  }
}
async function forgotPassword(){
  const email = document.getElementById('authEmail').value.trim();
  if(!email){ authMsg('Enter your email above first, then tap “Forgot password?”.'); return; }
  try{
    await fbAuth.sendPasswordResetEmail(email);
    authMsg('Reset link sent to ' + email + '. Check your inbox and spam folder.', 'ok');
  }catch(err){
    authMsg(AUTH_ERRORS[err.code] || 'Could not send the reset email. Please try again.');
  }
}
function logout(){
  if(!fbAuth){ return; }
  fbAuth.signOut().then(()=>location.reload());
}
function initAuthUI(){
  document.getElementById('tabLogin').addEventListener('click', ()=>setAuthMode('login'));
  document.getElementById('tabSignup').addEventListener('click', ()=>setAuthMode('signup'));
  document.getElementById('authForm').addEventListener('submit', submitAuth);
  document.getElementById('forgotBtn').addEventListener('click', forgotPassword);
  document.getElementById('pwToggle').addEventListener('click', ()=>{
    const inp = document.getElementById('authPass');
    const show = inp.type==='password';
    inp.type = show ? 'text' : 'password';
    const b = document.getElementById('pwToggle');
    b.textContent = show ? 'Hide' : 'Show';
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
}

const LEGACY_LS_KEY = 'jeeTrackerData_v1';   // old single-user key

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const todayStr = () => new Date().toISOString().slice(0,10);
const $ = (sel, root=document) => root.querySelector(sel);
const $all = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
}
function fmtDateShort(d){
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}
function daysBetween(a,b){
  const A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  return Math.round((B-A)/86400000);
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function clamp(n,a,b){return Math.max(a, Math.min(b,n));}
function pct(part, whole){ if(!whole) return 0; return clamp(Math.round((part/whole)*100),0,100); }
function hoursToHM(hDecimal){
  const h = Math.floor(hDecimal);
  const m = Math.round((hDecimal-h)*60);
  if(h<=0 && m<=0) return '0m';
  if(h<=0) return m+'m';
  if(m<=0) return h+'h';
  return h+'h '+m+'m';
}
function secToClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}

function nextJuneDate(offsetDays){
  const now = new Date();
  let y = now.getFullYear();
  let d = new Date(y+'-06-01T00:00:00');
  if(d < now) d = new Date((y+1)+'-06-01T00:00:00');
  if(offsetDays) d.setDate(d.getDate()+offsetDays);
  return d.toISOString().slice(0,10);
}

   DERIVED STATS
   ============================================================ */
function chapterCompletionPct(subject){
  const chs = DATA.chapters.filter(c=> !subject || c.subject===subject);
  if(chs.length===0) return 0;
  const doneWeight = chs.reduce((sum,c)=>{
    if(c.status==='Completed' || c.status==='Revised') return sum+1;
    if(c.status==='Studying') return sum+0.5;
    return sum;
  },0);
  return pct(doneWeight, chs.length);
}
function overallSyllabusPct(){
  return chapterCompletionPct(null);
}
function subjectStats(subject){
  const chs = DATA.chapters.filter(c=>c.subject===subject);
  return {
    total: chs.length,
    completed: chs.filter(c=>c.status==='Completed'||c.status==='Revised').length,
    remaining: chs.filter(c=>c.status==='Not Started'||c.status==='Studying').length,
    weak: chs.filter(c=>c.confidence==='Weak').length
  };
}
function todaysTasks(){
  return DATA.tasks.filter(t=>t.date===todayStr());
}
function pendingTasksAll(){
  return DATA.tasks.filter(t=>!t.completed);
}
function practiceForDate(dateStr){
  return DATA.practiceSessions.filter(p=>p.date===dateStr);
}
function questionsSolvedOn(dateStr){
  return practiceForDate(dateStr).reduce((s,p)=>s+Number(p.attempted||0),0);
}
function studyHoursOn(dateStr){
  const mins = DATA.studySessions.filter(s=>s.date===dateStr).reduce((s,x)=>s+Number(x.minutes||0),0);
  return mins/60;
}
function rangeDates(days){
  const arr = [];
  for(let i=days-1;i>=0;i--) arr.push(addDays(todayStr(), -i));
  return arr;
}
function sumInRange(fn, days){
  return rangeDates(days).reduce((s,d)=>s+fn(d),0);
}
function revisionsDueToday(){
  return DATA.revisions.filter(r=>!r.completed && r.dueDate===todayStr());
}
function revisionsOverdue(){
  return DATA.revisions.filter(r=>!r.completed && r.dueDate < todayStr());
}
function revisionsUpcoming(){
  return DATA.revisions.filter(r=>!r.completed && r.dueDate > todayStr());
}
function revisionStatusOf(r){
  if(r.completed) return 'Completed';
  if(r.dueDate < todayStr()) return 'Overdue';
  if(r.dueDate === todayStr()) return 'Due Today';
  return 'Upcoming';
}
function latestTest(){
  if(DATA.tests.length===0) return null;
  return [...DATA.tests].sort((a,b)=> b.date.localeCompare(a.date))[0];
}
function testAccuracy(t){
  const attempted = Number(t.correct||0)+Number(t.wrong||0);
  return attempted? pct(Number(t.correct||0), attempted) : 0;
}
function daysUntil(dateStr){
  return daysBetween(todayStr(), dateStr);
}

/* ---------------- Streak engine ---------------- */
function todayHasStudyActivity(){
  const minMinutes = Math.max(0, Number(DATA.settings.minStudyMinutesForStreak)||0);
  const minutesToday = studyHoursOn(todayStr())*60;
  if(minMinutes<=0) return minutesToday > 0;
  return minutesToday >= minMinutes;
}
function todayHasQuestionActivity(){
  const minQ = Math.max(0, Number(DATA.settings.minQuestionsForStreak)||0);
  const qToday = questionsSolvedOn(todayStr());
  if(minQ<=0) return qToday > 0;
  return qToday >= minQ;
}
function todayHasRevisionActivity(){
  const minRev = Math.max(0, Number(DATA.settings.minRevisionsForStreak)||0);
  const count = DATA.revisions.filter(r=> r.completedDate === todayStr()).length;
  if(minRev<=0) return count > 0;
  return count >= minRev;
}
function bumpStreak(key, activeToday){
  const s = DATA.streaks[key];
  if(!activeToday) return;
  if(s.lastDate === todayStr()) return; // already counted today
  if(s.lastDate === addDays(todayStr(),-1)){
    s.current += 1;
  } else {
    s.current = 1;
  }
  s.lastDate = todayStr();
  if(s.current > s.longest) s.longest = s.current;
}
function recomputeStreaks(){
  bumpStreak('study', todayHasStudyActivity());
  bumpStreak('question', todayHasQuestionActivity());
  bumpStreak('revision', todayHasRevisionActivity());
  // decay: if last active date is older than yesterday, reset current to 0 for display
  ['study','question','revision'].forEach(k=>{
    const s = DATA.streaks[k];
    if(s.lastDate && s.lastDate < addDays(todayStr(),-1)){
      s.current = 0;
    }
  });
  saveData();
}

/* Runs once a user is logged in (or immediately if Firebase isn't configured). */
async function startSession(user){
  if(APP_STARTED) return;
  APP_STARTED = true;

  if(user){
    fbUser = user; fbUid = user.uid; fbReady = false;   // stays false until the cloud copy has been read
    LS_KEY = LEGACY_LS_KEY + '_' + user.uid;   // each account gets its own local cache
  }

  const hadLocal = !!localStorage.getItem(LS_KEY);
  loadData();                                   // instant local load

  if(user){
    const cloud = await fbLoad();
    if(cloud){
      mergeCloud(cloud);
      saveDataLocalOnly();
    } else if(cloud === null){
      // brand-new account: bring over data from before logins existed (first account on this device only)
      const legacy = !hadLocal ? localStorage.getItem(LEGACY_LS_KEY) : null;
      if(legacy){
        try{ mergeCloud(JSON.parse(legacy)); localStorage.removeItem(LEGACY_LS_KEY); }catch(e){}
      }
      if(pendingName && !DATA.settings.studentName) DATA.settings.studentName = pendingName;
      saveDataLocalOnly();
      fbReady = true; fbSave();                 // create this user's cloud document
    }
    // cloud === undefined: read failed (offline) → keep local data for now
    fbReady = true;                             // from here on, every change syncs
  }

  hideAuthScreen();
  applyTheme();
  buildSidebar();
  buildBottomNav();
  updateTopDate();
  switchView('home');
  setInterval(()=>{ updateTopDate(); tickCountdowns(); }, 30000);
  setInterval(()=>{ if(CURRENT_VIEW==='home') renderHomeCountdownOnly(); }, 1000);

  $('#fabBtn').addEventListener('click', openQuickAddMenu);
  $('#moreMenuBtn').addEventListener('click', openMoreMenu);
}
function saveDataLocalOnly(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){ console.error('Save failed', e); }
}

function boot(){
  try{
    const t = localStorage.getItem('jeeTrackerTheme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  initAuthUI();

  if(!FIREBASE_ENABLED || !initFirebase()){
    // no Firebase → old offline-only behaviour, no login
    startSession(null);
    return;
  }
  showAuthLoading('Loading…');
  fbAuth.onAuthStateChanged(user=>{
    if(user){
      showAuthLoading('Loading your data…');
      startSession(user);
    } else if(!APP_STARTED){
      showAuthScreen();
      setAuthMode('login');
    }
  });
}

let PLANNER_TAB = 'today';

function renderPlanner(){
  const tabs = [
    {id:'today', label:"Today"},
    {id:'tomorrow', label:"Tomorrow"},
    {id:'week', label:"This Week"},
    {id:'completed', label:"Completed"},
    {id:'all', label:"All Tasks"},
  ];
  let list;
  if(PLANNER_TAB==='today') list = DATA.tasks.filter(t=>t.date===todayStr());
  else if(PLANNER_TAB==='tomorrow') list = DATA.tasks.filter(t=>t.date===addDays(todayStr(),1));
  else if(PLANNER_TAB==='week'){
    const start = todayStr(), end = addDays(todayStr(),6);
    list = DATA.tasks.filter(t=>t.date>=start && t.date<=end);
  }
  else if(PLANNER_TAB==='completed') list = DATA.tasks.filter(t=>t.completed);
  else list = DATA.tasks.slice();

  list = list.slice().sort((a,b)=> (a.date+a.startTime).localeCompare(b.date+b.startTime));

  const html = `
    <div class="tabs">
      ${tabs.map(t=>`<div class="tab ${PLANNER_TAB===t.id?'active':''}" data-tab="${t.id}">${t.label}</div>`).join('')}

      ${list.length ? list.map(taskRowHtml).join('') : emptyState('🗓️','No tasks here yet','Add a study task to build your plan.')}
    </div>
  `;
  view('planner').innerHTML = html;
  $all('.tab', view('planner')).forEach(t=>t.addEventListener('click', ()=>{ PLANNER_TAB=t.dataset.tab; renderPlanner(); }));
  $all('[data-taskaction]', view('planner')).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.closest('[data-id]').dataset.id;
    const act = b.dataset.taskaction;

    else if(act==='edit') openTaskModal(id);

  }));

function refreshTaskChapterOptions(){
  const subj = $('#tf-subject').value;
  const sel = $('#tf-chapter');

  const opts = DATA.chapters.filter(c=>c.subject===subj).map(c=>`<option>${esc(c.name)}</option>`).join('');
  sel.innerHTML = `<option value="">—</option>${opts}`;

function saveTask(id){
  const title = $('#tf-title').value.trim();
  if(!title){ toast('Please enter a task title'); return; }
  const payload = {
    title,
    subject: $('#tf-subject').value,
    chapter: $('#tf-chapter').value,
    date: $('#tf-date').value || todayStr(),
    startTime: $('#tf-time').value,
    duration: Number($('#tf-duration').value)||0,
    priority: $('#tf-priority').value,
  };
  updateData(d=>{
    if(id){
      Object.assign(d.tasks.find(t=>t.id===id), payload);
    } else {
      d.tasks.push(Object.assign({id:uid(), completed:false}, payload));
    }
  });
  closeModal();
  renderAll();
  toast(id?'Task updated':'Task added');
}
function confirmDelete(kind, id, msg){
  openModal(`

    <p class="muted" style="font-size:14px; margin-bottom:16px;">${msg}</p>

      <button class="btn danger" onclick="performDelete('${kind}','${id}')">Delete</button>

function performDelete(kind, id){
  if(kind==='task') deleteData('tasks', id);
  else if(kind==='chapter') deleteData('chapters', id);
  else if(kind==='practice') deleteData('practiceSessions', id);
  else if(kind==='test') deleteData('tests', id);
  else if(kind==='revision') deleteData('revisions', id);
  else if(kind==='studySession') deleteData('studySessions', id);
  closeModal();
  renderAll();
  toast('Deleted');
}

let CHAPTER_SUBJECT = 'Physics';
let CHAPTER_FILTER = { status:'', confidence:'', search:'' };

function scheduleRevisionsForChapter(chapterId){
  const exists = DATA.revisions.some(r=>r.chapterId===chapterId);
  if(exists) return;
  const gaps = (DATA.settings.revisionIntervals && DATA.settings.revisionIntervals.length) ? DATA.settings.revisionIntervals : [1,3,7,15];
  gaps.forEach((gap,i)=>{
    DATA.revisions.push({
      id: uid(), chapterId, round: i+1,
      dueDate: addDays(todayStr(), gap),
      completed:false, completedDate:null
    });
  });
}

function chapterPracticeStats(c){
  const sessions = DATA.practiceSessions.filter(p=>p.subject===c.subject && p.chapter===c.name);
  const attempted = sessions.reduce((s,p)=>s+Number(p.attempted||0),0);
  const correct = sessions.reduce((s,p)=>s+Number(p.correct||0),0);
  const wrong = sessions.reduce((s,p)=>s+Number(p.wrong||0),0);
  const accuracy = (correct+wrong) ? pct(correct, correct+wrong) : 0;
  return {attempted, correct, wrong, accuracy, sessionCount: sessions.length};
}
function chapterStudyMinutes(c){
  return DATA.studySessions.filter(s=>s.subject===c.subject && s.chapter===c.name).reduce((s,x)=>s+Number(x.minutes||0),0);
}

function bindChapterRowEvents(){
  $all('.card[data-id]', view('chapters')).forEach(card=>{

      openChapterDetail(card.dataset.id);
    });
  });
  $all('[data-chaction="delete"]', view('chapters')).forEach(b=>b.addEventListener('click', (e)=>{
    e.stopPropagation();

  }));
  $all('[data-chfield]', view('chapters')).forEach(el=>{
    el.addEventListener('click', e=>e.stopPropagation());
    el.addEventListener('change', ()=>{
      const id = el.closest('[data-id]').dataset.id;
      const field = el.dataset.chfield;
      const val = el.type==='checkbox' ? el.checked : el.value;
      updateData(d=>{
        const ch = d.chapters.find(c=>c.id===id);
        ch[field] = val;

      });
      renderAll();
      if(field==='status') toast('Chapter status updated');
    });
  });

let TEST_FILTER = { type:'' };

  let tests = DATA.tests.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(TEST_FILTER.type) tests = tests.filter(t=>t.type===TEST_FILTER.type);
  const avgScore = DATA.tests.length ? Math.round(DATA.tests.reduce((s,t)=>s+Number(t.total||0),0)/DATA.tests.length) : 0;
  const avgAcc = DATA.tests.length ? Math.round(DATA.tests.reduce((s,t)=>s+testAccuracy(t),0)/DATA.tests.length) : 0;
  const best = DATA.tests.length ? Math.max(...DATA.tests.map(t=>Number(t.total||0))) : 0;
  const withTotalQ = DATA.tests.filter(t=>t.totalQuestions);
  const avgAttemptRate = withTotalQ.length ? Math.round(withTotalQ.reduce((s,t)=>s+pct(t.questions||0, t.totalQuestions),0)/withTotalQ.length) : null;

  let improvement = '';

/* ============================================================
   REVISION TRACKER
   ============================================================ */
let REVISION_TAB = 'due';

function completeRevision(revId){
  updateData(d=>{
    const r = d.revisions.find(x=>x.id===revId);
    if(!r) return;
    r.completed = true;
    r.completedDate = todayStr();
    const chapter = d.chapters.find(c=>c.id===r.chapterId);
    if(chapter){
      const totalRounds = d.revisions.filter(x=>x.chapterId===r.chapterId).length;
      chapter.revisionStatus = (r.round>=totalRounds) ? 'Completed' : 'In Progress';
      chapter.status = 'Revised';
    }
  });
}

function renderRevision(){
  const due = revisionsDueToday();
  const overdue = revisionsOverdue();
  const upcoming = revisionsUpcoming().sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  const completed = DATA.revisions.filter(r=>r.completed).sort((a,b)=> (b.completedDate||'').localeCompare(a.completedDate||''));

  const tabs = [
    {id:'due', label:`Due Today (${due.length})`},
    {id:'overdue', label:`Overdue (${overdue.length})`},
    {id:'upcoming', label:`Upcoming (${upcoming.length})`},
    {id:'completed', label:`Completed (${completed.length})`},
  ];
  let list;
  if(REVISION_TAB==='due') list = due;
  else if(REVISION_TAB==='overdue') list = overdue;
  else if(REVISION_TAB==='upcoming') list = upcoming;
  else list = completed;

  const html = `
    <div class="grid grid-4" style="margin-bottom:16px;">
      <div class="stat"><div class="val" style="color:var(--amber);">${due.length}</div><div class="lbl">Due today</div></div>
      <div class="stat"><div class="val" style="color:var(--red);">${overdue.length}</div><div class="lbl">Overdue</div></div>
      <div class="stat"><div class="val" style="color:var(--indigo);">${upcoming.length}</div><div class="lbl">Upcoming</div></div>
      <div class="stat"><div class="val" style="color:var(--green);">${completed.length}</div><div class="lbl">Completed</div></div>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<div class="tab ${REVISION_TAB===t.id?'active':''}" data-rtab="${t.id}">${t.label}</div>`).join('')}
    </div>
    <button class="btn block" style="margin-bottom:14px;" onclick="openCustomRevisionModal()">+ Add Custom Revision</button>
    <div class="list">
      ${list.length ? list.map(revisionRowHtml).join('') : emptyState('🔁','Nothing here','Complete chapters to auto-schedule spaced revisions.')}
    </div>
  `;
  view('revision').innerHTML = html;
  $all('[data-rtab]', view('revision')).forEach(t=>t.addEventListener('click', ()=>{ REVISION_TAB=t.dataset.rtab; renderRevision(); }));
  $all('[data-revaction]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.closest('[data-id]').dataset.id;
    const act = b.dataset.revaction;
    if(act==='complete'){ completeRevision(id); renderAll(); toast('Revision marked complete'); }
    else if(act==='edit') openEditRevisionDateModal(id);
    else if(act==='delete') confirmDelete('revision', id, 'Delete this revision entry?');
  }));

function subjectStudyTimeBreakdown(){
  const subjects = ['Physics','Chemistry','Mathematics'];
  const mins = subjects.map(s=>DATA.studySessions.filter(x=>x.subject===s).reduce((sum,x)=>sum+Number(x.minutes||0),0));
  const generalMin = DATA.studySessions.filter(x=>!x.subject).reduce((sum,x)=>sum+Number(x.minutes||0),0);
  const maxMin = Math.max(1, ...mins, generalMin);
  const colors = {Physics:'var(--indigo)', Chemistry:'var(--amber)', Mathematics:'var(--green)'};
  let rows = subjects.map((s,i)=>`<div class="hbar-row"><div class="hb-label">${s}</div><div class="hb-track"><div style="width:${pct(mins[i],maxMin)}%; background:${colors[s]};"></div></div><div class="hb-val">${hoursToHM(mins[i]/60)}</div></div>`).join('');
  if(generalMin>0) rows += `<div class="hbar-row"><div class="hb-label">General</div><div class="hb-track"><div style="width:${pct(generalMin,maxMin)}%; background:var(--slate);"></div></div><div class="hb-val">${hoursToHM(generalMin/60)}</div></div>`;
  return rows || `<p class="muted">No study sessions logged yet.</p>`;
}
function avgSessionLengthMin(){
  if(!DATA.studySessions.length) return 0;
  const total = DATA.studySessions.reduce((s,x)=>s+Number(x.minutes||0),0);
  return Math.round(total/DATA.studySessions.length);
}
function weakChaptersList(){
  const weak = DATA.chapters.filter(c=>c.confidence==='Weak' && c.status!=='Revised');
  if(!weak.length) return emptyState('💪','No weak chapters flagged','Mark low-confidence chapters as "Weak" to see them here.');
  return weak.slice(0,8).map(c=>`<div class="row-item"><div class="ri-main"><div class="ri-title">${esc(c.name)}</div><div class="ri-sub">${esc(c.subject)} · ${esc(c.status)}</div></div><span class="badge weak">Weak</span></div>`).join('');
}
function sumInRangeOffset(fn, days, offset){
  const arr = [];
  for(let i=days-1;i>=0;i--) arr.push(addDays(todayStr(), -(i+offset)));
  return arr.reduce((s,d)=>s+fn(d),0);
}
function avgAccuracyInRange(offset, days){
  const start = addDays(todayStr(), -(offset+days-1));
  const end = addDays(todayStr(), -offset);
  const sessions = DATA.practiceSessions.filter(p=>p.date>=start && p.date<=end);
  const correct = sessions.reduce((s,p)=>s+Number(p.correct||0),0);
  const wrong = sessions.reduce((s,p)=>s+Number(p.wrong||0),0);
  return (correct+wrong) ? pct(correct, correct+wrong) : 0;
}
function compareCard(label, cur, prev, fmt){
  const f = fmt || (v=>v);
  const diff = cur - prev;
  const up = diff > 0, flat = diff===0;
  return `<div class="stat">
    <div class="val">${f(cur)}</div>
    <div class="lbl">${label}</div>
    <div style="font-size:11px; font-weight:700; margin-top:2px; color:${flat?'var(--ink-soft)':(up?'var(--green)':'var(--red)')};">${flat?'No change':(up?'▲ ':'▼ ')+f(Math.abs(diff))+' vs last wk'}</div>
  </div>`;
}
function last8WeeksRevisionRate(){
  const weeks = [];
  for(let w=7; w>=0; w--){
    const start = addDays(todayStr(), -(w*7+6));
    const end = addDays(todayStr(), -(w*7));
    const count = DATA.revisions.filter(r=>r.completed && r.completedDate>=start && r.completedDate<=end).length;
    weeks.push({label:'W'+(8-w), count});
  }
  return weeks;
}

}
function sessionRowHtml(s){
  const timeRange = (s.startTime && s.endTime) ? ` · ${s.startTime}–${s.endTime}` : '';
  return `<div class="row-item" data-id="${s.id}"><div class="ri-main">
    <div class="ri-title">${esc(s.subject||'Study')}${s.chapter?' · '+esc(s.chapter):''}</div>
    <div class="ri-sub">${fmtDateShort(s.date)} · ${Math.round(s.minutes)} min${timeRange}</div>
  </div>
  <div class="ri-actions"><button class="icon-btn" data-sessaction="delete">${ICONS.trash}</button></div>
  </div>`;
}
function openManualSessionModal(){
  const chapterOptions = subj => DATA.chapters.filter(c=>c.subject===subj).map(c=>`<option>${esc(c.name)}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>Log Study Session</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="field"><label>Date</label><input type="date" id="ms-date" value="${todayStr()}"></div>
    <div class="field-row">
      <div class="field"><label>Subject</label>
        <select id="ms-subject" onchange="refreshManualChapterOptions()">
          <option>Physics</option><option>Chemistry</option><option>Mathematics</option><option value="">General / Other</option>
        </select>
      </div>
      <div class="field"><label>Chapter / Topic</label><select id="ms-chapter"><option value="">—</option>${chapterOptions('Physics')}</select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Started at</label><input type="time" id="ms-start" value="18:00"></div>
      <div class="field"><label>Ended at</label><input type="time" id="ms-end" value="19:00"></div>
    </div>
    <p class="muted" id="ms-duration-preview" style="margin-bottom:6px;"></p>
    <div class="modal-actions">
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveManualSession()">Save Session</button>
    </div>
  `);
  refreshManualChapterOptions();
  const updatePreview = ()=>{
    const mins = manualSessionMinutes();
    const el = $('#ms-duration-preview');
    if(el) el.textContent = mins>0 ? `Duration: ${hoursToHM(mins/60)}` : 'End time must be after start time';
  };
  $('#ms-start').addEventListener('input', updatePreview);
  $('#ms-end').addEventListener('input', updatePreview);
  updatePreview();
}
function manualSessionMinutes(){
  const start = $('#ms-start').value, end = $('#ms-end').value;
  if(!start || !end) return 0;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins <= 0) mins += 24*60; // crosses midnight
  return mins;
}
function refreshManualChapterOptions(){
  const subj = $('#ms-subject').value;
  $('#ms-chapter').innerHTML = `<option value="">—</option>` + DATA.chapters.filter(c=>c.subject===subj).map(c=>`<option>${esc(c.name)}</option>`).join('');
}
function saveManualSession(){
  const totalMinutes = manualSessionMinutes();
  if(totalMinutes<=0){ toast('End time must be after start time'); return; }
  const date = $('#ms-date').value || todayStr();
  const subject = $('#ms-subject').value;
  const chapter = $('#ms-chapter').value;
  const startTime = $('#ms-start').value;
  const endTime = $('#ms-end').value;
  updateData(d=>{
    d.studySessions.push({id:uid(), date, minutes: totalMinutes, subject, chapter, startTime, endTime});
  });
  closeModal();
  renderAll();
  toast('Study session logged');
}
function setTimerMode(mode){
  if(TimerState.running) return toast('Stop the current session first');
  TimerState.mode = mode;
  TimerState.phase = 'study';
  TimerState.pomoCount = 0;
  TimerState.elapsedSec = 0;
  renderTimer();
}
function currentPhaseTotalSec(){
  const s = DATA.settings;
  if(TimerState.phase==='study') return s.pomodoroMinutes*60;
  if(TimerState.phase==='longbreak') return s.pomodoroLongBreak*60;
  return s.pomodoroBreak*60;
}
function renderTimerText(){
  if(TimerState.mode==='stopwatch') return secToClock(TimerState.elapsedSec);
  const remaining = Math.max(0, currentPhaseTotalSec() - TimerState.elapsedSec);
  return secToClock(remaining);
}
function startTimer(){
  if(TimerState.running) return;
  TimerState.running = true;
  TimerState.intervalId = setInterval(()=>{
    TimerState.elapsedSec += 1;
    if(TimerState.mode==='pomodoro' && TimerState.elapsedSec >= currentPhaseTotalSec()){
      handlePomodoroPhaseEnd();
    }
    const disp = $('#timerDisplay');
    if(disp) disp.textContent = renderTimerText();
  },1000);
  renderTimer();
}
function pauseTimer(){
  TimerState.running = false;
  clearInterval(TimerState.intervalId);
  renderTimer();
}
function handlePomodoroPhaseEnd(){
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  if(TimerState.phase==='study'){
    logStudyMinutesPrompt(DATA.settings.pomodoroMinutes);
    TimerState.pomoCount += 1;
    TimerState.phase = (TimerState.pomoCount % 4 === 0) ? 'longbreak' : 'break';
  } else {
    TimerState.phase = 'study';
  }
  TimerState.elapsedSec = 0;
  toast(TimerState.phase==='study' ? 'Break over — back to focus!' : 'Focus session complete — take a break');
  renderTimer();
}
function stopTimer(){
  if(TimerState.elapsedSec < 1){ resetTimer(); return; }
  const minutes = TimerState.mode==='stopwatch' ? TimerState.elapsedSec/60 : Math.min(TimerState.elapsedSec, currentPhaseTotalSec())/60;
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  if(TimerState.mode==='pomodoro' && TimerState.phase!=='study'){
    // break session, don't log study time
    resetTimer();
    return;
  }
  logStudyMinutesPrompt(minutes);
  resetTimer();
}
function resetTimer(){
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  TimerState.elapsedSec = 0;
  TimerState.phase = 'study';
  TimerState.pomoCount = 0;
  renderTimer();
}
function logStudyMinutesPrompt(minutes){
  const chapterOptions = subj => DATA.chapters.filter(c=>c.subject===subj).map(c=>`<option>${esc(c.name)}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>Session complete</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="muted" style="margin-bottom:14px;">You studied for ${hoursToHM(minutes/60)}. What did you cover?</p>
    <div class="field"><label>Subject</label>
      <select id="ss-subject" onchange="refreshSessionChapterOptions()">
        <option>Physics</option><option>Chemistry</option><option>Mathematics</option><option value="">General / Other</option>
      </select>
    </div>
    <div class="field"><label>Chapter / Topic</label><select id="ss-chapter"><option value="">—</option>${chapterOptions('Physics')}</select></div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="discardSession()">Discard</button>
      <button class="btn" onclick="saveStudySession(${minutes})">Save Session</button>
    </div>
  `);
  refreshSessionChapterOptions();
}
function refreshSessionChapterOptions(){
  const subj = $('#ss-subject').value;
  $('#ss-chapter').innerHTML = `<option value="">—</option>` + DATA.chapters.filter(c=>c.subject===subj).map(c=>`<option>${esc(c.name)}</option>`).join('');
}
function discardSession(){
  closeModal();
  renderAll();
}
function saveStudySession(minutes){
  const subject = $('#ss-subject').value;
  const chapter = $('#ss-chapter').value;
  updateData(d=>{
    d.studySessions.push({id:uid(), date:todayStr(), minutes, subject, chapter});
  });
  closeModal();
  renderAll();
  toast('Study session saved');
}

</script>
</body>
</html>
